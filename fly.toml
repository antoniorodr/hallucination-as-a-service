# fly.toml app configuration file generated for haas on 2026-11-18T12:55:44+01:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'haas'
primary_region = 'arn'

[build]
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
